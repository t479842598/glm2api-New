version: '3.8'

services:
  glm2api:
    build: .
    container_name: glm2api
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - GLM_USE_GUEST_REFRESH_TOKEN=true
      - ADMIN_KEY=glm2api-admin
      - LOG_LEVEL=INFO
    restart: unless-stopped
    volumes:
      - ./.env:/app/.env
